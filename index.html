<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HybridTask | Gestão Compacta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: {
              indigo: { 600: '#4f46e5', 700: '#4338ca' },
              slate: { 950: '#020617' }
            }
          }
        }
      }
    </script>
    <style>
      :root { scroll-padding-top: 60px; }
      body { 
        font-family: 'Inter', sans-serif; 
        font-size: 0.8125rem; 
        transition: background-color 0.2s ease;
      }
      
      .font-size-sm { font-size: 0.75rem; }
      .font-size-md { font-size: 0.8125rem; }
      .font-size-lg { font-size: 0.875rem; }

      /* PADRÃO DARK MODE UNIFICADO */
      .dark body { background-color: #000000; color: #cbd5e1; }
      
      /* Superfícies Principais */
      .dark .bg-white { background-color: #0a0a0a !important; }
      .dark .bg-slate-50 { background-color: #000000 !important; }
      .dark .bg-slate-100 { background-color: #0d0d0d !important; }
      .dark .bg-slate-200 { background-color: #1a1a1a !important; }
      
      /* Bordas */
      .dark .border-slate-100 { border-color: #111111 !important; }
      .dark .border-slate-200 { border-color: #1a1a1a !important; }
      .dark .border-slate-800 { border-color: #1a1a1a !important; }
      .dark .border-white\/\[0\.05\] { border-color: #1a1a1a !important; }
      
      /* Texto */
      .dark .text-slate-900 { color: #ffffff !important; }
      .dark .text-slate-800 { color: #f1f5f9 !important; }
      .dark .text-slate-700 { color: #e2e8f0 !important; }
      .dark .text-slate-600 { color: #94a3b8 !important; }
      .dark .text-slate-500 { color: #64748b !important; }
      .dark .text-slate-400 { color: #475569 !important; }

      /* Inputs e Selects */
      .dark input, .dark select, .dark textarea {
        background-color: #0d0d0d !important;
        border-color: #1a1a1a !important;
        color: #ffffff !important;
      }

      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      .dark ::-webkit-scrollbar-thumb { background: #262626; }

      .notes-grid { column-gap: 0.75rem; }
      .note-item { break-inside: avoid; margin-bottom: 0.75rem; }
      
      .glow-effect:hover {
        box-shadow: 0 0 15px rgba(79, 70, 229, 0.4);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.10.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "recharts": "https://esm.sh/recharts@^3.5.1",
    "@hello-pangea/dnd": "https://esm.sh/@hello-pangea/dnd@^18.0.1",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.87.1",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0"
  }
}
</script>
</head>
  <body class="bg-slate-50 dark:bg-black text-slate-900 dark:text-slate-200 overflow-x-hidden font-size-md theme-transition">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
