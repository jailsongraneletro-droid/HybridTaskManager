<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HybridTask | Gestão Compacta</title>
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="/manifest.json" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: {
              indigo: { 600: '#4f46e5', 700: '#4338ca' },
              slate: { 950: '#020617' }
            }
          }
        }
      }
    </script>
    <style>
      :root { scroll-padding-top: 60px; }
      body { 
        font-family: 'Inter', sans-serif; 
        font-size: 0.8125rem; 
        transition: background-color 0.2s ease;
        -webkit-font-smoothing: antialiased;
      }
      
      .font-size-sm { font-size: 0.75rem; }
      .font-size-md { font-size: 0.8125rem; }
      .font-size-lg { font-size: 0.875rem; }

      /* PADRÃO DARK MODE UNIFICADO (ref: pasted image 5 + apoio WhatsApp) */
      .dark body { background-color: #111315; color: #e9eef5; }
      
      /* Superfícies Principais */
      .dark .bg-white { background-color: #24282d !important; }
      .dark .bg-slate-50 { background-color: #111315 !important; }
      .dark .bg-slate-100 { background-color: #1a1d21 !important; }
      .dark .bg-slate-200 { background-color: #20242a !important; }
      .dark .bg-slate-700 { background-color: #2a2f36 !important; }
      .dark .bg-slate-800 { background-color: #24282d !important; }
      .dark .bg-slate-900 { background-color: #1a1d21 !important; }
      .dark .bg-zinc-800 { background-color: #24282d !important; }
      .dark .bg-zinc-900 { background-color: #1a1d21 !important; }
      
      /* Bordas - Contraste aumentado para separação */
      .dark .border-slate-100 { border-color: #2a2f36 !important; }
      .dark .border-slate-200 { border-color: #2a2f36 !important; }
      .dark .border-slate-700 { border-color: #2a2f36 !important; }
      .dark .border-slate-800 { border-color: #2a2f36 !important; }
      .dark .border-white\/\[0\.05\] { border-color: #2a2f36 !important; }
      
      /* Texto */
      .dark .text-slate-900 { color: #eef2f7 !important; }
      .dark .text-slate-800 { color: #dfe6ee !important; }
      .dark .text-slate-700 { color: #c6cdd7 !important; }
      .dark .text-slate-600 { color: #aeb7c2 !important; }
      .dark .text-slate-500 { color: #919aa6 !important; }
      .dark .text-slate-400 { color: #757f8b !important; }

      /* Inputs e Selects */
      .dark input, .dark select, .dark textarea {
        background-color: #1f2329 !important;
        border-color: #2f3640 !important;
        color: #e9eef5 !important;
      }

      /* Date input */
      .date-input {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: textfield;
        background-image: none;
      }
      .date-input::-webkit-calendar-picker-indicator {
        opacity: 0;
        -webkit-appearance: none;
        display: none;
      }
      .date-input::-webkit-inner-spin-button,
      .date-input::-webkit-clear-button {
        display: none;
        -webkit-appearance: none;
      }
      .date-input::-moz-calendar-picker-indicator {
        opacity: 0;
      }
      .dark input[type="date"] { color-scheme: dark; }

      /* Time input */
      .time-input {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: textfield;
        background-image: none;
      }
      .time-input::-webkit-calendar-picker-indicator {
        opacity: 0;
        -webkit-appearance: none;
        display: none;
      }
      .time-input::-webkit-inner-spin-button,
      .time-input::-webkit-clear-button {
        display: none;
        -webkit-appearance: none;
      }
      .time-input::-moz-calendar-picker-indicator {
        opacity: 0;
      }
      .dark input[type="time"] { color-scheme: dark; }

      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      .dark ::-webkit-scrollbar-thumb { background: #333333; }

      .col-resizer {
        position: absolute;
        top: 0;
        right: 0;
        width: 4px;
        height: 100%;
        cursor: col-resize;
        z-index: 10;
        transition: background-color 0.2s;
      }
      .col-resizer:hover {
        background-color: #4f46e5;
      }

      .notes-grid { column-gap: 0.75rem; }
      .note-item { break-inside: avoid; margin-bottom: 0.75rem; }
      
      .glow-effect:hover {
        box-shadow: 0 0 15px rgba(79, 70, 229, 0.4);
      }

      @media (max-width: 640px) {
        .mobile-scroll-x {
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.10.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "recharts": "https://esm.sh/recharts@^3.5.1",
    "@hello-pangea/dnd": "https://esm.sh/@hello-pangea/dnd@^18.0.1",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.87.1"
  }
}
</script>
</head>
  <body class="bg-slate-50 dark:bg-[#111315] text-slate-900 dark:text-slate-200 overflow-x-hidden font-size-md theme-transition">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
