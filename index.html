    <style>
      body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
      
      /* Modern & Minimalist Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
        transition: background 0.3s ease;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #cbd5e1;
      }
      
      /* Custom scrollbar for containers */
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #4f46e520;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: #4f46e540;
      }

      .text-gradient { background: linear-gradient(to right, #4f46e5, #9333ea); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

      /* Improved Sidebar Tooltip System */
      .sidebar-tooltip {
        position: relative;
      }
      .sidebar-tooltip::after {
        content: attr(data-tooltip);
        position: absolute;
        left: calc(100% + 14px);
        top: 50%;
        transform: translateY(-50%) translateX(-10px);
        background: #1e293b;
        color: white;
        padding: 8px 14px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        z-index: 1000;
      }
      .sidebar-tooltip::before {
        content: '';
        position: absolute;
        left: calc(100% + 4px);
        top: 50%;
        transform: translateY(-50%) translateX(-10px);
        border: 6px solid transparent;
        border-right-color: #1e293b;
        opacity: 0;
        pointer-events: none;
        transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 1000;
      }
      .sidebar-tooltip:hover::after,
      .sidebar-tooltip:hover::before {
        opacity: 1;
        transform: translateY(-50%) translateX(0);
      }
      
      /* Active state for tooltip (optional, prevents flickering) */
      .sidebar-tooltip:active::after, .sidebar-tooltip:active::before {
        opacity: 0;
      }

      /* Enhanced Shadows for Icons */
      .icon-shadow {
        filter: drop-shadow(0 2px 4px rgba(79, 70, 229, 0.15));
      }
      .icon-shadow-active {
        filter: drop-shadow(0 4px 8px rgba(255, 255, 255, 0.4));
      }
    </style>
